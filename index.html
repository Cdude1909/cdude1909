<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KARTIK JOSHI | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #ffffff;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --accent-primary: #7c3aed;
        --accent-secondary: #4f46e5;
        --surface-glass: rgba(240, 240, 244, 0.85);
        --border-glass: rgba(0, 0, 0, 0.08);
      }

      html.dark {
        --bg-primary: #030303;
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --accent-primary: #a78bfa;
        --accent-secondary: #818cf8;
        --surface-glass: rgba(6, 6, 9, 0.88);
        --border-glass: rgba(255, 255, 255, 0.1);
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
      }

      /* Subtle Ambient Background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 0% 0%, rgba(124, 58, 237, 0.03) 0%, transparent 40%),
          radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.03) 0%, transparent 40%);
        z-index: -1;
        pointer-events: none;
      }

      .glass-card {
        background: var(--surface-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-glass);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .glass-card:hover {
        border-color: var(--accent-primary);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
        transform: translateY(-4px);
      }

      /* Remove traditional scrollbar completely */
      html, body, * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE and Edge */
      }
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }

      /* CSS Morphing Gradients Animations */
      @keyframes morphBlob1 {
        0%, 100% {
          border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        33% {
          border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%;
          transform: translate3d(5vw, 4vh, 0) rotate(120deg) scale(1.18);
        }
        66% {
          border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%;
          transform: translate3d(-4vw, -3vh, 0) rotate(240deg) scale(0.95);
        }
      }

      @keyframes morphBlob2 {
        0%, 100% {
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        }
        33% {
          border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
          transform: translate3d(-6vw, 5vh, 0) rotate(-120deg) scale(1.22);
        }
        66% {
          border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%;
          transform: translate3d(4vw, -5vh, 0) rotate(-240deg) scale(0.9);
        }
      }

      @keyframes morphBlob3 {
        0%, 100% {
          border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%;
          transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
        }
        50% {
          border-radius: 35% 65% 60% 40% / 40% 40% 60% 60%;
          transform: translate3d(3vw, -4vh, 0) scale(1.15) rotate(180deg);
        }
      }

      @keyframes auraGlowPulse {
        0%, 100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.06);
        }
      }

      .animate-morph-1 {
        animation: morphBlob1 38s ease-in-out infinite;
        will-change: transform, border-radius;
      }

      .animate-morph-2 {
        animation: morphBlob2 45s ease-in-out infinite;
        will-change: transform, border-radius;
      }

      .animate-morph-3 {
        animation: morphBlob3 52s ease-in-out infinite;
        will-change: transform, border-radius;
      }

      .animate-aura-glow {
        animation: auraGlowPulse 4s ease-in-out infinite;
      }

      /* Slow Orbiting Gradient Bubble Animations around Explore Projects Button */
      @keyframes orbitOrbPrimary {
        0% {
          transform: translate3d(-50%, -50%, 0) rotate(0deg) translateX(118px) rotate(0deg);
        }
        100% {
          transform: translate3d(-50%, -50%, 0) rotate(360deg) translateX(118px) rotate(-360deg);
        }
      }

      @keyframes orbitOrbSecondary {
        0% {
          transform: translate3d(-50%, -50%, 0) rotate(180deg) translateX(105px) rotate(-180deg);
        }
        100% {
          transform: translate3d(-50%, -50%, 0) rotate(540deg) translateX(105px) rotate(-540deg);
        }
      }

      .animate-orbit-orb-1 {
        animation: orbitOrbPrimary 14s linear infinite;
        will-change: transform;
      }

      .animate-orbit-orb-2 {
        animation: orbitOrbSecondary 19s linear infinite;
        will-change: transform;
      }

      /* Hide default cursor on desktop */
      @media (min-width: 1024px) {
        * {
          cursor: none !important;
        }
      }

      /* Custom Cursor */
      .cursor-dot,
      .cursor-outline {
          display: none;
          pointer-events: none;
          position: fixed;
          top: 0;
          left: 0;
          border-radius: 50%;
          z-index: 9999;
          opacity: 0;
          transition: opacity 0.3s ease;
      }
      @media (min-width: 1024px) {
        .cursor-dot,
        .cursor-outline {
          display: block;
        }
      }
      .cursor-dot {
          width: 8px;
          height: 8px;
          background-color: var(--accent-primary);
          box-shadow: 0 0 15px var(--accent-primary);
          margin-left: -4px;
          margin-top: -4px;
      }
      .cursor-outline {
          width: 40px;
          height: 40px;
          border: 1px solid var(--accent-primary);
          background: transparent;
          margin-left: -20px;
          margin-top: -20px;
      }
      body:hover .cursor-dot,
      body:hover .cursor-outline {
          opacity: 1;
      }
      .cursor-active {
        opacity: 1 !important;
      }

      /* App Animations */
      @keyframes appReveal {
        from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .app-reveal {
        animation: appReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .scroll-reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .scroll-reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
